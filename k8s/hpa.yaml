apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nihongo-api
  namespace: nihongo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nihongo-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
